name: Testler

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, ipad]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'ipad' && 'webkit' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: "1"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: test-results/
          retention-days: 7
